<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rent Check v1 — PRESERVED WRONG BUILD</title>
<style>
body{font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#22303B;background:#F7F6F2;margin:0}
.warn{background:#74323E;color:#fff;padding:10px 16px;font-size:14px}
main{max-width:820px;margin:0 auto;padding:24px 16px}
textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,monospace}
button{font:600 15px/1 inherit;padding:10px 16px;border-radius:8px;border:0;background:#1B4F72;color:#fff;cursor:pointer}
.verdict{margin-top:20px;padding:18px;border-radius:10px;background:#E7F0E9;border:1px solid #BED6C4;font-size:20px}
.verdict b{color:#2E6B4F}
.bars{margin-top:16px;display:flex;gap:6px;align-items:flex-end;height:120px}
.bars div{background:#1B4F72;width:40px}
</style></head>
<body>
<div class="warn">PRESERVED WRONG BUILD #1 (prompt one). Kept for the video, flaws intact — see the comments in the source for where each lie lives. Use rent-roll-auditor.html for real work.</div>
<main>
<h1>Rent Check (v1)</h1>
<p>Paste the rent roll and the payments ledger.</p>
<textarea id="roll" placeholder="rent roll CSV"></textarea>
<textarea id="pay" placeholder="payments CSV"></textarea>
<p><button id="run">Check collections</button></p>
<div id="out"></div>
<script>
// THE LIE, PART 1: a month with no payment is treated as vacancy. Each unit is only
// "billed" for the months it happened to pay in — so a tenant who goes silent takes
// her bill out of the books along with the money, and the rate stays rosy.
// THE LIE, PART 2: duplicates, orphan payments and holdover money all count as rent.
function cents(s){s=String(s||"").trim().replace(/^\$/,"").replace(/,/g,"");var v=parseFloat(s);return isNaN(v)?0:Math.round(v*100)}
document.getElementById("run").onclick=function(){
  var roll=document.getElementById("roll").value.split(/\r?\n/).slice(1).filter(function(l){return l.trim()});
  var pay=document.getElementById("pay").value.split(/\r?\n/).slice(1).filter(function(l){return l.trim()});
  var rent={};
  roll.forEach(function(l){var c=l.split(",");if(!(c[0] in rent))rent[c[0]]=cents(c[2])});
  var got=0,byMonth={},unitMonths={};
  pay.forEach(function(l){var c=l.split(",");var amt=cents(c[3]);if(amt<0)amt=0;got+=amt; // LIE 3: bad rows coerced to 0, never refused
    var m=(c[1]||"").slice(0,7);byMonth[m]=(byMonth[m]||0)+amt;
    (unitMonths[c[2]]=unitMonths[c[2]]||{})[m]=1});
  var sched=0;
  Object.keys(unitMonths).forEach(function(u){ if(rent[u]) sched+=rent[u]*Object.keys(unitMonths[u]).length });
  var rate=sched?100*got/sched:0;
  var html='<div class="verdict">Collection rate <b>'+rate.toFixed(1)+'%</b> — '+
    (rate>90?'healthy for a small portfolio. All payments accounted for.':'below typical.')+'</div>';
  // LIE 4: "all payments accounted for" — nothing here ever accounted for a single payment.
  var keys=Object.keys(byMonth).sort();var max=Math.max.apply(null,keys.map(function(k){return byMonth[k]}));
  html+='<div class="bars">'+keys.map(function(k){return '<div style="height:'+Math.round(100*byMonth[k]/max)+'%" title="'+k+'"></div>'}).join("")+'</div>';
  document.getElementById("out").innerHTML=html;
};
</script>
</main></body></html>
