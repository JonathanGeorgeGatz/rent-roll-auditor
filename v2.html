<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Rent Check v2 — PRESERVED WRONG BUILD</title>
<style>
body{font:16px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:#22303B;background:#F7F6F2;margin:0}
.warn{background:#74323E;color:#fff;padding:10px 16px;font-size:14px}
main{max-width:860px;margin:0 auto;padding:24px 16px}
textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,monospace}
button{font:600 15px/1 inherit;padding:10px 16px;border-radius:8px;border:0;background:#1B4F72;color:#fff;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:16px}
th,td{padding:6px 8px;border-bottom:1px solid #D9D5CC;text-align:left}
.miss{color:#8E2D2D;font-weight:700}
</style></head>
<body>
<div class="warn">PRESERVED WRONG BUILD #2 (prompt two). Kept for the video, flaws intact — see the comments in the source for where each lie lives. Use rent-roll-auditor.html for real work.</div>
<main>
<h1>Rent Check (v2) — month by month</h1>
<textarea id="roll" placeholder="rent roll CSV"></textarea>
<textarea id="pay" placeholder="payments CSV"></textarea>
<p><button id="run">Check month by month</button></p>
<div id="out"></div>
<script>
// THE LIE, PART 1: calendar buckets. A payment counts toward the month printed in its
// date — so rent paid a few days early lands in the wrong bucket, and the tenant who
// always pays on the 28th gets accused of missing a month she paid for.
// THE LIE, PART 2: every row is money. The duplicated bank import counts twice, so the
// doubled March quietly covers a month that was never paid at all.
function cents(s){s=String(s||"").trim().replace(/^\$/,"").replace(/,/g,"");var v=parseFloat(s);return isNaN(v)?0:Math.round(v*100)}
document.getElementById("run").onclick=function(){
  var roll=document.getElementById("roll").value.split(/\r?\n/).slice(1).filter(function(l){return l.trim()});
  var pay=document.getElementById("pay").value.split(/\r?\n/).slice(1).filter(function(l){return l.trim()});
  var units={};
  roll.forEach(function(l){var c=l.split(",");if(!units[c[0]])units[c[0]]={tenant:c[1],rent:cents(c[2]),paid:{}}});
  var maxM="";
  pay.forEach(function(l){var c=l.split(",");var u=units[c[2]];var m=(c[1]||"").slice(0,7);if(m>maxM&&/^\d{4}-\d{2}$/.test(m))maxM=m;
    if(!u)return; // LIE 3: payments for unknown units are silently dropped, not reported
    u.paid[m]=(u.paid[m]||0)+cents(c[3])});
  var months=[];var y=2026;for(var mo=1;mo<=12;mo++){var k="2026-"+("0"+mo).slice(-2);if(k<=maxM)months.push(k)}
  var rows=[],missTotal=0;
  Object.keys(units).forEach(function(k){var u=units[k];
    months.forEach(function(m){var got=u.paid[m]||0;
      if(got<u.rent){rows.push([k,u.tenant,m,got,u.rent]);missTotal+=u.rent-got}})});
  var html='<p>'+(rows.length?'<span class="miss">'+rows.length+' month(s) look unpaid or short:</span>':'Every month covered.')+'</p>';
  html+='<table><tr><th>Unit</th><th>Tenant</th><th>Month</th><th>Paid</th><th>Rent</th></tr>'+
    rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td>$'+(r[3]/100).toFixed(2)+'</td><td>$'+(r[4]/100).toFixed(2)+'</td></tr>'}).join("")+'</table>';
  document.getElementById("out").innerHTML=html;
};
</script>
</main></body></html>
